  TextSection:
    Contents: A rare multiple congenital anomalies/dysmorphic syndrome characterized
      by infancy/early childhood-onset severe global developmental delay (manifests
      mostly by delayed sitting and walking/inability to walk) severe intellectual
      disability with minimal or no speech pyramidal signs (including lower limb spasticity
      hyperreflexia spastic gait and feet contractures) short stature microcephaly
      and dysmorphic facial features (including a long face strabismus short philtrum
      open mouth full lips or everted lower lip and teeth abnormalities). Seizures
      and dystonic/dyskinetic movements may also be present in some patients.
    TextSectionType: Definition
  TypeOfInheritances:
    TypeOfInheritance:
    - value: Autosomal recessive
