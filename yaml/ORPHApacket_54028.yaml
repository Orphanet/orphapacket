  Synonyms:
  - Synonym: Kelly-Paterson syndrome
  - Synonym: Sideropenic dysphagia
  TextSection:
    Contents: A rare hematological disorder characterized by the classic triad of
      iron-deficiency anemia dysphagia and esophageal webs. It predominantly affects
      Caucasian women aged 40-70&nbsp;years although pediatric cases have been reported.
      Dysphagia is usually painless intermittent or progressive over several years
      and limited to solids; it is sometimes associated with weight loss while anemia-related
      symptoms such as fatigue and pallor may predominate. Additional signs include
      glossitis angular cheilitis and koilonychia. Splenomegaly and thyroid enlargement
      may occur. Iron deficiency is considered a major potential etiological factor.
      The syndrome is associated with an increased risk of developing squamous cell
      carcinoma of the upper gastrointestinal tract.
