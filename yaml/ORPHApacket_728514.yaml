  TextSection:
    Contents: A rare subtype of pontocerebellar hypoplasia (PCH) characterized by
      an almost complete absence of motor and cognitive development microcephaly epilepsy
      spastic tetraplegia vision impairment extrapyramidal movements and stereotypies.
      Brain imaging is distinct from other PCH subtypes and consists of mild-to-severe
      PCH ventriculomegaly thin corpus callosum and hypoplasia and T2-weighted hyperintensity
      of the basal ganglia and thalamus.
    TextSectionType: Definition
  TypeOfInheritances:
    TypeOfInheritance:
    - value: Autosomal recessive
