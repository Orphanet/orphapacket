  - Synonym: Isolated generalized cerebellar hypoplasia
  TextSection:
    Contents: A rare isolated cerebellar malformation characterized by a normal shape
      but reduced volume of the cerebellar vermis and hemispheres with no other neurological
      anomalies or extracerebral congenital malformations. The majority of patients
      present with impaired ambulation global developmental delay with or without
      intellectual disability. Other signs might include hypotonia truncal appendicular
      and gait ataxia as well as oculomotor abnormalities.
