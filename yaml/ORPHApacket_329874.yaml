  Synonyms:
  - Synonym: IGCM
  TextSection:
    Contents: A rare cardiac disease characterized by rapidly progressing myocarditis
      of unknown origin that may lead to progressive heart failure heart block ventricular
      arrhythmias or sudden cardiac death. It is histologically characterized by myocardial
      necrosis and fibrosis with multinucleated giant cells and inflammatory cell
      infiltrate. Some patients have associated autoimmune disorders. It is a high-mortality
      risk condition and patients often require a heart transplant.
