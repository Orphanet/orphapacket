  TextSection:
    Contents: A group of rare disorders characterized by brachydactyly due to abnormal
      development of the phalanges and/or metacarpals. Brachydactyly is part of a
      group of limb malformations characterized by dysostosis involving abnormal development
      of individual bones either in isolation or in combination with other skeletal
      abnormalities. These disorders primarily affect the skeleton although extraskeletal
      manifestations may also occur.
