  TextSection:
    Contents: A rare genetic motor neuron disorder characterized by degeneration of
      alpha motor neurons in the spinal cord and lower brainstem manifesting within
      the first six months of life with severe and progressive muscle weakness including
      respiratory insufficiency and dysphagia. Classically before the introduction
      of disease-modifying therapies patients with proximal spinal muscular atrophy
      (SMA) type&nbsp;1 never achieved independent sitting.
    TextSectionType: Definition
