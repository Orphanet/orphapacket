  TextSection:
    Contents: A rare subtype of pontocerebellar hypoplasia characterized by global
      developmental delay motor impairment axial hypotonia and distal hypotonia as
      well as severe brainstem dysfunctions (feeding and respiratory difficulties
      central apnea bradycardia). Other variable clinical features can include ophtalmological
      cardiac and gastrointestinal anomalies facial dysmorphism and epilepsy. This
      subtype is associated with perinatal lethality. Brain imaging usually shows
      cerebellar hypoplasia together with brainstem hypoplasia.
    TextSectionType: Definition
  TypeOfInheritances:
    TypeOfInheritance:
    - value: Autosomal recessive
