  Synonyms:
  - Synonym: CMS
  TextSection:
    Contents: A rare genetic neuromuscular disease characterized by impaired transmission
      at the neuromuscular junction typically presenting in infancy or childhood although
      later onset is possible. The hallmark symptom is muscle fatigability frequently
      accompanied by ocular manifestations (ptosis ophthalmoparesis) bulbar involvement
      (dysphagia) a generalized weakness which can lead to potentially life-threatening
      respiratory insufficiency.
    TextSectionType: Definition
  TypeOfInheritances:
