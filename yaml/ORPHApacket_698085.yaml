  TextSection:
    Contents: A rare multiple congenital anomalies/dysmorphic syndrome characterized
      by global developmental delay intellectual disability severe language delay/absence
      of language and impaired motor skills. All affected individuals present with
      dysmorphic features including coarse facies prominent forehead board depressed
      nasal root long smooth philtrum tented mouth and low-set ears. Behavioral problems
      including tendency of self-injury hyperactivity aggressivity and outbursts of
      anger are reported in the majority of the patients. Defects in nuclear lobulation
      reminiscent of Pelger-Huët anomaly are frequently detected in cytological examinations.
    TextSectionType: Definition
