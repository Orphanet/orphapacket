  TextSection:
    Contents: A rare genetic disorder of galactose metabolism characterized by persistent
      congenital galactosemia due to deficiency of the enzyme galactose mutarotase.
      Patients may present bilateral cataract mild liver dysfunction/elevated AST
      ALT/hepatomegaly and jaundice in the neonatal period.
    TextSectionType: Definition
