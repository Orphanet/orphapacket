  TextSection:
    Contents: A rare autoinflammatory syndrome characterized by mostly early-onset
      recurrent refractory fever attacks painful and recurrent mucosal ulceration
      affecting predominantly gastrointestinal (that may lead to inflammatory bowel
      disease) oral and genital areas. Additional variable features may include skin
      rash psoriasis axillary dermal abscesses musculoskeletal disorders polyarthritis
      arthralgia and autoimmune thyroid disorder. Ocular manifestations (including
      uveitis chorioretinal scarring and macular fibrosis secondary to retinal vasculitis)
      are infrequent.
    TextSectionType: Definition
  TypeOfInheritances:
    TypeOfInheritance:
    - value: Autosomal dominant
