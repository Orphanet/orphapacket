  - Synonym: Right atrial isomerism
  TextSection:
    Contents: A form of heterotaxy characterized by both atrial appendages having
      the morphology of a right atrial appendage often associated with two morphologically
      right lungs and/or bronchi and asplenia. Associated cardiovascular defects are
      frequent including dextrocardia or mesocardia common atrioventricular junction
      (atrioventricular septal defect) ventricular hypoplasia in half of cases anomalous
      ventriculo-arterial connections (malposition or transposition of the great arteries)
      anomalous systemic and pulmonary venous connections (total anomalous pulmonary
      venous return) absent coronary sinus and frequent subpulmonary stenosis. Cardiac
      arrhythmias are frequently observed. Typical extracardiac anomalies are midline
      liver intestinal malrotation.
    TextSectionType: Definition
  TypeOfInheritances:
    TypeOfInheritance:
    - value: Autosomal recessive
