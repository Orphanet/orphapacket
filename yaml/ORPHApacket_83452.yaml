  TextSection:
    Contents: A rare neurologic disease characterized by persistent pain that is disproportionate
      to the inciting event. The pain is regional usually affecting a limb with a
      distal predominance and may occur spontaneously or be stimulus-induced. It is
      associated with sensory disturbances vasomotor abnormalities (including changes
      in skin color and temperature) sudomotor abnormalities edema and motor or trophic
      changes. Symptoms often develop following trauma fractures immobilization surgery
      or nerve injury and their severity and clinical presentation can vary considerably
      among patients.
    TextSectionType: Definition
