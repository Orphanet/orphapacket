    Contents: A rare developmental disorder of the ciliopathy group characterized
      by highly arched palate with bifid and lobulated tongue lingual hamartoma multiple
      frenula bilateral supernumerary lower canines hypertelorism telecanthus strabismus
      broad and/or bifid nasal tip short stature bifid hallux poly- and syndactyly
      mild intellectual disability and specific retinal abnormalities mostly retinal
      coloboma. Brain structural anomalies may also be observed.
