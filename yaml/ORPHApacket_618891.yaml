  TextSection:
    Contents: A rare acid sphingomyelinase deficiency characterized by mild to massive
      hepatosplenomegaly hypersplenism leading to thrombocytopenia interstitial lung
      disease dyslipidemia and central nervous system manifestations (including developmental
      delay intellectual disability and ataxia). Some affected individuals may present
      with coarse facial features.
    TextSectionType: Definition
  TypeOfInheritances:
    TypeOfInheritance:
    - value: Autosomal recessive
