  - Synonym: Charcot-Marie-Tooth disease with focally folded myelin
  TextSection:
    Contents: A form of Charcot-Marie-Tooth disease type 4 characterized by a childhood
      onset of slowly progressing demyelinating or axonal sensorimotor neuropathy
      focally folded myelin sheaths in nerve biopsy reduced nerve conduction velocities
      (less than 38&nbsp;m/s) and the typical CMT phenotype (i.e. distal muscle weakness
      and atrophy sensory loss and absence of deep tendon reflexes). In some patients
      microcephaly intellectual disability and multiple cranial neuropathies have
      been described.
    TextSectionType: Definition
