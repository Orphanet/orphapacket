  Synonyms:
  - Synonym: NBIA1, atypical form
  - Synonym: Neurodegeneration with brain iron accumulation type 1, atypical form
  - Synonym: PKAN, atypical form
  TextSection:
    Contents: A rare neurodegenerative disorder characterized by adolescent to adult-onset
      of slowly progressive dystonia dysarthria neuropsychiatric changes parkinsonism
      and abnormal iron accumulation in the globus pallidus and substantia nigra with
      a characteristic eye-of-the-tiger sign on T2-weighted MRI. Atypical pantothenate
      kinase-associated neurodegeneration (PKAN) has later onset and slower progression
      than classic PKAN and accounts for about 25% of cases.
    TextSectionType: Definition
  TypeOfInheritances:
    TypeOfInheritance:
    - value: Autosomal recessive
