  TextSection:
    Contents: A rare inborn error of metabolism characterized by congenital asplenia
      and childhood or adolescent onset of generalized inflammation persistent intravascular
      hemolysis and anemia severe endothelial injury with abnormal coagulation bleeding
      diathesis and nephropathy. Additional reported manifestations include growth
      retardation mild facial dysmorphism and hepatomegaly.
