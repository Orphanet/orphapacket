  - Synonym: OFD14
  - Synonym: Oral-facial-digital syndrome type 14
  TextSection:
    Contents: A rare developmental disorder of the ciliopathy group characterized
      by oral facial and digital malformations associated with microcephaly and cerebral
      malformations such as corpus callosum agenesis and vermis hypoplasia with molar
      tooth sign. Oral manifestations include gingival frenulae lingual hamartomas
      cleft/lobulated tongue and a cleft palate. Facial features can include telecanthus
      and an upslanting palpebral fissures. Digital malformations encompass hands
      postaxial polydactyly and duplication of the hallux.
    TextSectionType: Definition
  TypeOfInheritances:
    TypeOfInheritance:
    - value: Autosomal recessive
