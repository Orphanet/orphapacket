  Synonyms:
  - Synonym: PSSD
  - Synonym: Post-SSRI sexual dysfunction
  TextSection:
    Contents: A rare neurologic disease characterized by persistent side effects of
      depression treatment with selective serotonin reuptake inhibitors (SSRIs) manifests
      as a range of sexual and reproductive dysfunctions. Commonly experienced clinical
      signs in (male) patients include the triad of genital anesthesia decreased or
      lost libido and erectile dysfunction as well as weak or pleasureless orgasm
      premature ejaculation reduced penile size decreased seminal volume and testicular
      atrophy or pain. In female patients additional manifestations may include vaginal
      lubrication difficulties irregular menstruation and nipple insensitivity. These
      symptoms may begin days or weeks after initiation of treatment and can persist
      even after the medication is discontinued significantly impacting quality of
      life.
    TextSectionType: Definition
