  TextSection:
    Contents: A rare genetic motor neuron disorder characterized by degeneration of
      alpha motor neurons in the spinal cord and lower brainstem manifesting between
      6 and 18&nbsp;months of age with progressive predominantly proximal muscle weakness.
      Classically before the introduction of disease-modifying therapies patients
      with proximal spinal muscular atrophy (SMA) type&nbsp;2 learned to sit but never
      achieved independent ambulation.
    TextSectionType: Definition
