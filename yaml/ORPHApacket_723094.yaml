  TextSection:
    Contents: A group of galactosemias characterized by GALT deficiency and presenting
      with variable clinical features depending on the residual GALT activity present
      in affected individuals going from classic galactosemia manifesting with life-threatening
      complications triggered by breastfeeding or the ingestion of lactose/galactose-containing
      formula in untreated infants and long term-complications despite diet (GALT
      activity <1%) to a less severe phenotype (GALT activity 1-10%) or completely
      asymptomatic patients (GALT activity 25-30%).
