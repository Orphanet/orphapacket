  TextSection:
    Contents: A rare myopathy characterized by progressive muscle weakness and the
      presence of characteristic reducing bodies in muscle fibres. Reducing bodies
      are defined histopathologically by a strong menadione nitro blue tetrazolium
      reaction in the absence of the substrate alpha-glycerophosphate.
