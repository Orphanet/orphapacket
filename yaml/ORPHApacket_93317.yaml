  TextSection:
    Contents: A rare spondylodysplastic dysplasia characterized by severe neonatal
      hypotonia spondylometaphyseal dysplasia cardiac arrhythmia and central nervous
      system anomalies leading to death in the first days of life due to cardiorespiratory
      failure. Skeletal anomalies include irregular appearance of the iliac crest
      and bone abnormal long bones of the extremities (including shortening widening
      and cupping) and increased intervertebral disc space. Visceral anomalies include
      subendocardial myocarditis myocardial necrosis adrenal and pulmonary hemorrhage.
      Cranial magnetic resonance imaging reveals intracranial abnormalities such as
      simplified gyral pattern hypogenesis of the corpus callosum and cerebellar hypoplasia.
    TextSectionType: Definition
