  - Synonym: Complete situs inversus viscerum
  - Synonym: Situs inversus
  TextSection:
    Contents: A rare developmental defect during embryogenesis characterized by complete
      mirror-imaged arrangement of the internal organs across the left-right axis
      of the body. Primary ciliary dyskinesia Kartagener type is frequently associated.
      Congenital heart disease are present in 43% of cases which is less frequent
      than in patients with heterotaxy. Similarly extracardiac and vascular anomalies
      can be associated (e.g. intestinal malrotation spleen anomalies absence of retrohepatic
      inferior vena cava bilateral superior vena cava) but less frequently that in
      heterotaxy.
    TextSectionType: Definition
