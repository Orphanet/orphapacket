  - Synonym: Left atrial isomerism
  TextSection:
    Contents: A form of heterotaxy characterized by both atrial appendages having
      the morphology of a left atrial appendage often associated with two morphologically
      left lungs and/or bronchi and polysplenia. Associated cardiovascular defects
      are frequent including common atrioventricular junction (atrioventricular septal
      defect) anomalous systemic (interrupted caval vein with azygos continuation)
      or pulmonary (ipsilateral venous return) venous connections. Cardiac arrhythmias
      and atrioventricular block are frequently observed. Typical extracardiac anomalies
      are midline liver intestinal malrotation and biliary atresia.
    TextSectionType: Definition
