  TextSection:
    Contents: A rare multiple congenital anomalies/dysmorphic syndrome characterized
      by congenital aplasia cutis of variable size along the midline of the scalp
      tooth enamel hypoplasia and discoloration and delayed psychomotor development
      or intellectual disability. Additional clinical features may include intrauterine
      or postnatal growth retardation autism spectrum disorder congenital cataracts
      skull defects and seizures.
