  TextSection:
    Contents: A rare growth hormone insensitivity syndrome characterized by moderate
      postnatal growth delay markedly low circulating levels of insulin-like growth
      factor&nbsp;1 (IGF-1) and insulin-like growth factor binding protein&nbsp;3
      (IGFBP-3) normal response to growth hormone stimulation test and insulin insensitivity
      marked by normal glucose levels and hyperinsulinemia. Additional findings may
      include subnormal IGF-2 IGFBP-1 and IGFBP-2 levels as well as microcephaly delayed
      puberty and bone maturation and reduced bone mineral density in some cases.
    TextSectionType: Definition
