  Synonyms:
  - Synonym: Midline heart
  TextSection:
    Contents: A rare congenital non-syndromic heart malformation characterized by
      an atypical location of the heart in a central position within the thorax with
      the apex situated in the midline. The atrial arrangement is usually normal whereas
      the ventricles may be inverted. Various congenital heart anomalies have also
      been associated such as congenitally corrected transposition of the great arteries.
