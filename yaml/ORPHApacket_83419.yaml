  TextSection:
    Contents: A rare genetic motor neuron disorder characterized by degeneration of
      alpha motor neurons in the spinal cord and lower brainstem manifesting between
      18&nbsp;months and 18&nbsp;years of age and associated with slowly progressive
      predominantly proximal muscle weakness. By definition individuals with proximal
      spinal muscular atrophy (SMA) type&nbsp;3 achieve independent ambulation before
      symptom onset but ambulation may be lost over the course of the disease.
    TextSectionType: Definition
