  TextSection:
    Contents: A rare neurodevelopmental disorder characterized by the combination
      of at least two neurodevelopmental disorders including specific learning disorder
      (e.g. impairment in reading written expression or mathematics) motor disorder
      (e.g. developmental coordination disorder stereotypic movement disorder tic
      disorder) communication disorder (e.g. developmental language disorder speech
      sound disorder childhood-onset fluency disorder social/pragmatic communication
      disorder) attention deficit/hyperactivity disorder (ADD/ADHD) and other specified
      or unspecified neurodevelopmental disorders as defined in DSM-5 or ICD-11. Patients
      don't reach the criteria of an autism spectrum disorder diagnosis do not have
      intellectual disability but can present with unspecific dysmorphic features
      and/or congenital anomalies.
