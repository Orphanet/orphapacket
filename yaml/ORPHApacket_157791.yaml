  TextSection:
    Contents: A rare vascular tumor characterized by a wide clinical variability ranging
      from indolent to locally aggressive behavior with a high metastatic potential.
      The tumor may arise anywhere in the body most commonly in the lungs liver and
      bones. Histologically it is composed of epithelioid endothelial cells arranged
      in short cords and nests in a myxohyaline stroma and molecularly it is characterized
      by <i>WWTR1-CAMTA1</i> (approximately 90%) or <i>YAP1-TFE3</i> (approximately
      10%) gene fusions. Rarely other fusion genes are found.
