  TextSection:
    Contents: A rare aggressive respiratory tumor arising from mesothelial cells of
      the pleura characterized by chest pain dyspnea cough and fatigue. It is strongly
      associated with asbestos exposure and typically develops after a long latency
      period (20-40 years). It usually presents as a diffuse invasive tumor but may
      also occur as a localized mass or as pleural mesothelioma in situ a preinvasive
      lesion confined to the pleural surface.
    TextSectionType: Definition
