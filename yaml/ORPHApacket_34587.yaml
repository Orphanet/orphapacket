  TextSection:
    Contents: A rare X-linked genetic condition due to deficiency of the lysosomal-associated
      membrane protein 2 (LAMP2) characterized by severe cardiomyopathy and variable
      degrees of muscle weakness frequently associated with intellectual deficits
      (in males).
