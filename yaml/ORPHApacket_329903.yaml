  TextSection:
    Contents: A primary form of membranoproliferative glomerulonephritis (MPGN) characterized
      by deposition in the renal glomeruli of immunoglobulin with complement fractions
      especially C3. Clinical presentation may range from nephrotic syndrome and acute
      kidney injury to asymptomatic proteinuria and hematuria.
