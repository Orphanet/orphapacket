  TextSection:
    Contents: A rare congenital X-linked dyserythropoietic anemia characterized by
      moderate to severe anemia without thrombocytopenia variable degrees of neutropenia
      and bone marrow findings of trilineage dysplasia with hypocellularity of erythroid
      and granulocytic lineages. Peripheral blood shows anisocytosis macrocytosis
      poikilocytosis elliptocytes and fragmented erythrocytes. Platelet count is typically
      normal although platelet morphology may be abnormal.
