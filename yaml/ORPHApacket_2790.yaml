  Synonyms:
  - Synonym: Autosomal dominant osteosclerosis, Worth type
  - Synonym: Worth syndrome
  TextSection:
    Contents: A rare primary bone dysplasia characterized by increased and diffuse
      skeletal densification particularly of the cranial vault and tubular long bones
      that is not associated with an increased risk of fracture. Craniofacial anomalies
      usually develop during adolescence and include a prominent forehead wide and
      deep mandibles a flat nasal bridge taurus palatinus and an increased gonial
      angle. Neurological complications are present in approximately one fifth of
      affected patients usually in the form of entrapment neuropathies such as hearing
      loss and are secondary to nerve tissue compression by hyperostotic bone cerebellar
      disturbances due to a reduction in size of the posterior cranial fossa or tonsillar
      herniation and chronic intracranial hypertension.
    TextSectionType: Definition
  TypeOfInheritances:
    TypeOfInheritance:
    - value: Autosomal dominant
