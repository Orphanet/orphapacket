  TextSection:
    Contents: A rare combined immunodeficiency characterized by velo-cardio-facial
      gestalt (short and narrow palpebral fissures tubulous nose small mouth micrognathia
      low-set ears flattened malar eminences broad cheeks) congenital heart defect
      abnormal thymus and parathyroid and velopharyngeal insufficiency. Short stature
      and psychiatric disorders may also present. Developmental and speech delay were
      reported in few patients. Even though patients carrying <i>TBX1</i> mutations
      may manifest clinical features that are overlapping with 22q11.2 deletion syndrome
      the presence and frequency of these symptoms significantly differs; not all
      patients with <i>TBX1</i> mutations have congenital heart defect hypocalcemia
      psychiatric disorders or developmental delay contrary to 22q11.2 deletion syndrome
      patients where these features are commonly present.
    TextSectionType: Definition
